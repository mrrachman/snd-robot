<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SND ROBOT — License Portal</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0f0f0f; color:#fff; font-family:'Segoe UI',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .card { background:#1a1a1a; border:1px solid #2a2a2a; border-radius:12px; padding:40px; width:100%; max-width:420px; }
  h1 { font-size:22px; color:#00c896; margin-bottom:4px; }
  p.sub { color:#888; font-size:13px; margin-bottom:28px; }
  label { display:block; font-size:12px; color:#aaa; margin-bottom:6px; }
  input { width:100%; padding:10px 14px; background:#111; border:1px solid #333; border-radius:8px; color:#fff; font-size:14px; margin-bottom:16px; outline:none; }
  input:focus { border-color:#00c896; }
  button { width:100%; padding:12px; background:#00c896; color:#000; font-weight:700; border:none; border-radius:8px; cursor:pointer; font-size:15px; }
  button:hover { background:#00a87e; }
  .btn-reset { background:transparent; color:#00c896; border:1px solid #00c896; margin-top:8px; }
  .btn-reset:hover { background:#00c89622; }
  .msg { margin-top:16px; font-size:13px; text-align:center; }
  .err { color:#ff4d4d; }
  .ok  { color:#00c896; }
  .link { margin-top:16px; text-align:center; font-size:13px; color:#888; }
  .link a { color:#00c896; text-decoration:none; }
</style>
</head>
<body>
<div class="card">
  <h1>SND ROBOT</h1>
  <p class="sub">EA License Portal</p>
  <label>Email</label>
  <input type="email" id="email" placeholder="email@example.com">
  <label>Password</label>
  <input type="password" id="password" placeholder="••••••••">
  <button onclick="doLogin()">Login</button>
  <button class="btn-reset" onclick="doReset()">Lupa Password?</button>
  <div class="msg" id="msg"></div>
  <div class="link">Belum punya akun? <a href="register.html">Daftar</a></div>
</div>
<script>
const SUPA_URL = 'https://nkeytmarkudwzilkmfde.supabase.co';
const SUPA_KEY = 'ISI_KUNCI_PUBLISHABLE';

async function doLogin() {
  const email = document.getElementById('email').value;
  const pass  = document.getElementById('password').value;
  const msg   = document.getElementById('msg');
  msg.textContent = 'Loading...';
  msg.className = 'msg';

  const res = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=password`, {
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPA_KEY},
    body: JSON.stringify({email, password:pass})
  });
  const data = await res.json();
  if(data.access_token) {
    localStorage.setItem('token', data.access_token);
    localStorage.setItem('email', email);
    window.location.href = 'dashboard.html';
  } else {
    msg.textContent = data.error_description || 'Login gagal';
    msg.className = 'msg err';
  }
}

async function doReset() {
  const email = document.getElementById('email').value;
  const msg   = document.getElementById('msg');
  if(!email) {
    msg.textContent = 'Masukkan email dulu sebelum klik Lupa Password';
    msg.className = 'msg err';
    return;
  }
  msg.textContent = 'Mengirim email reset...';
  msg.className = 'msg';
  const res = await fetch(`${SUPA_URL}/auth/v1/recover`, {
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPA_KEY},
    body: JSON.stringify({email})
  });
  if(res.ok) {
    msg.textContent = 'Email reset password sudah dikirim! Cek inbox kamu.';
    msg.className = 'msg ok';
  } else {
    msg.textContent = 'Gagal kirim email reset. Coba lagi.';
    msg.className = 'msg err';
  }
}
</script>
</body>
</html>
